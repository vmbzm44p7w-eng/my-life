<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f3ed"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>MY LIFE</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#332b24;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px 50px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:48px;margin:12px 0}small{color:#78685a;letter-spacing:2px}button,input,textarea,select{font:inherit}button{border:1px solid #d8c9b6;border-radius:12px;padding:12px;background:#fffaf3;color:#332b24;cursor:pointer}button.primary{background:#292720;color:#fff4df} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.tile{text-align:left;min-height:110px;background:#eee5d8}.tile b{display:block;font:24px Georgia;margin:8px 0}.line{background:#fffaf3;border:1px solid #e5d9ca;border-radius:15px;padding:14px;margin:10px 0}.line img{max-width:100%;max-height:240px;border-radius:10px}input:not([type=checkbox]),textarea,select{width:100%;padding:12px;border:1px solid #d8c9b6;border-radius:10px;background:white;margin:6px 0}label{display:block;margin:8px 0}dialog{border:1px solid #d8c9b6;border-radius:20px;width:min(94%,500px);max-height:90vh;background:#f7f3ed;color:#332b24}dialog::backdrop{background:#0006}.actions{display:flex;gap:8px;flex-wrap:wrap}p{line-height:1.5}#notice{color:#78685a;font-size:13px}.tile{min-width:0;overflow-wrap:anywhere;background:var(--tile,#eee5d8);color:var(--ink,#332b24)}.tile b{font-size:clamp(18px,5vw,24px)}.line{border-left:4px solid var(--accent,#b6a18a)}.line p{white-space:pre-wrap;overflow-wrap:anywhere}.line img{display:block;width:auto;object-fit:contain;margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools>*{flex:1;min-width:120px}progress{width:100%;accent-color:var(--accent,#81705b)}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0}.days button{padding:9px 2px}.days .marked{background:#705b8c;color:white}.section-title{border-bottom:1px solid #d8c9b6;padding-bottom:8px}.muted{font-size:13px;color:#78685a}main{padding-bottom:max(40px,env(safe-area-inset-bottom))}</style><main><small>THE ART OF LIVING BEAUTIFULLY</small><h1>My Life.</h1><p id="notice"></p><p class="muted">Версия 2.0</p><div id="view"></div></main><dialog id="editor"><form id="form"><h2>Запись</h2><label>Название<input id="name" required></label><label>Заметка<textarea id="note"></textarea></label><label>Оценка (необязательно)<input id="rating" type="number" min="0" max="10" step="0.5"></label><label><input id="done" type="checkbox"> Выполнено / просмотрено / прочитано</label><label>Фото<input id="photo" type="file" accept="image/*"></label><label><input id="removePhoto" type="checkbox"> Удалить прежнее фото</label><div class="actions"><button class="primary" type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form></dialog><input hidden type="file" id="import" accept=".json,application/json"><script>
const $=id=>document.getElementById(id), key='my-life-v1';const defaults=['🎬 Кино','📚 Библиотека','🌍 Путешествия','🍽️ Рестораны','🌸 Ароматы','💎 Мечты','🎒 Survival','🛒 Покупки','🦋 Трансформация','🍇 Коллекции'].map(title=>({title,items:[]}));let data,active=-1,editing=-1;try{data=JSON.parse(localStorage.getItem(key))||defaults}catch{data=defaults}function save(){try{localStorage.setItem(key,JSON.stringify(data));$('notice').textContent='Сохранено на этом устройстве';return true}catch{$('notice').textContent='Не удалось сохранить. Освободите место или экспортируйте резервную копию.';return false}}function el(tag,text,parent,cls){let x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;parent.append(x);return x}function btn(parent,text,fn,cls){let b=el('button',text,parent,cls);b.onclick=fn;return b}const palette=[['#29272a','#eee1c7'],['#e4d7bf','#58432c'],['#dce6e9','#375563'],['#e8d5c7','#69483b'],['#efdee3','#87566a'],['#f0e5cc','#8a713d'],['#dce0d0','#4e5941'],['#e6eadb','#536749'],['#e5ddef','#705b8c'],['#603441','#f3d9c5']];let query='',sort='default';function render(){let v=$('view');v.replaceChildren();v.style.setProperty('--accent',palette[active]?.[1]||'#81705b');if(active<0){el('p','Моя жизнь в деталях',v);let g=el('div',undefined,v,'grid');data.forEach((c,i)=>{let b=btn(g,'',()=>{active=i;query='';sort='default';render()},'tile');b.style.setProperty('--tile',palette[i]?.[0]||'#eee5d8');b.style.setProperty('--ink',palette[i]?.[1]||'#332b24');el('b',c.title,b);el('span',c.items.length+' записей',b)});btn(v,'＋ Новая коллекция',()=>{let t=prompt('Название коллекции');if(t?.trim()){data.push({title:t.trim(),items:[]});save();render()}},'primary');let a=el('div',undefined,v,'actions');btn(a,'Экспорт копии',()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let l=document.createElement('a');l.href=u;l.download='my-life-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),3000)});btn(a,'Импорт копии',()=>$('import').click());el('p','Личные данные остаются в браузере. Регулярно экспортируйте копию: очистка данных Safari может удалить записи.',v);return}let c=data[active];btn(v,'‹ Все коллекции',()=>{active=-1;render()});el('h2',c.title,v,'section-title');btn(v,'Переименовать коллекцию',()=>{let t=prompt('Название',c.title);if(t?.trim()){let old=c.title;c.title=t.trim();if(!save())c.title=old;render()}});let total=c.items.length,done=c.items.filter(r=>r.done).length;el('p',`Отмечено: ${done} из ${total}`,v,'muted');let pr=el('progress',undefined,v);pr.max=total||1;pr.value=done;if(active===8){el('h2','Календарь · 75 дней',v);let days=c.days||[];el('p',`${days.length} из 75 дней отмечено`,v);let dg=el('div',undefined,v,'days');for(let d=1;d<=75;d++){let b=btn(dg,String(d),()=>{let old=c.days;c.days=days.includes(d)?days.filter(x=>x!==d):[...days,d];if(!save())c.days=old;render()},days.includes(d)?'marked':'');b.setAttribute('aria-pressed',String(days.includes(d)))} }btn(v,'＋ Добавить запись',()=>edit(-1),'primary');let tools=el('div',undefined,v,'tools');let search=el('input',undefined,tools);search.type='search';search.placeholder='Поиск по записям';search.value=query;let sel=el('select',undefined,tools);for(let [value,label] of [['default','По умолчанию'],['rating','По оценке'],['name','По названию'],['todo','Не отмеченные'],['done','Отмеченные']]){let o=el('option',label,sel);o.value=value}sel.value=sort;let list=el('div',undefined,v);function draw(){list.replaceChildren();let rows=c.items.map((r,i)=>({r,i})).filter(({r})=>(r.name+' '+(r.note||'')).toLowerCase().includes(query.toLowerCase())&&(sort!=='todo'||!r.done)&&(sort!=='done'||r.done));if(sort==='rating'||(sort==='default'&&active===0))rows.sort((a,b)=>(b.r.rating??-1)-(a.r.rating??-1));if(sort==='name')rows.sort((a,b)=>a.r.name.localeCompare(b.r.name,'ru'));if(!rows.length)el('p','Нет записей',list);rows.forEach(({r,i})=>{let box=el('div',undefined,list,'line');let label=el('label',undefined,box);let check=el('input',undefined,label);check.type='checkbox';check.checked=!!r.done;check.onchange=()=>{let old=r.done;r.done=check.checked;if(!save()){r.done=old;check.checked=!!old}pr.value=c.items.filter(x=>x.done).length;pr.previousElementSibling.textContent=`Отмечено: ${pr.value} из ${total}`;if(sort==='todo'||sort==='done')draw()};label.append(document.createTextNode(' '+r.name));if(r.rating!==null&&r.rating!==undefined)el('p','★ '+r.rating+'/10',box);if(r.note)el('p',r.note,box);if(r.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)){let im=el('img',undefined,box);im.src=r.photo;im.alt=r.name}let a=el('div',undefined,box,'actions');btn(a,'Изменить',()=>edit(i));btn(a,'Удалить',()=>{if(confirm('Удалить запись?')){let removed=c.items.splice(i,1);if(!save())c.items.splice(i,0,...removed);render()}})})}search.oninput=()=>{query=search.value;draw()};sel.onchange=()=>{sort=sel.value;draw()};draw()}function edit(i){editing=i;let r=data[active].items[i]||{};$('name').value=r.name||'';$('note').value=r.note||'';$('rating').value=r.rating??'';$('done').checked=!!r.done;$('photo').value='';$('removePhoto').checked=false;$('editor').showModal()}$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=async e=>{e.preventDefault();let c=data[active],old=c.items[editing],photo=$('removePhoto').checked?'':old?.photo||'';let f=$('photo').files[0];if(f){try{let im=await createImageBitmap(f),cv=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);photo=cv.toDataURL('image/jpeg',.7);im.close()}catch{alert('Не удалось открыть фото');return}}let r={...old,name:$('name').value.trim(),note:$('note').value,rating:$('rating').value===''?null:Number($('rating').value),done:$('done').checked,photo};if(!r.name)return;if(editing<0)c.items.push(r);else c.items[editing]=r;if(!save()){if(editing<0)c.items.pop();else c.items[editing]=old;return}$('editor').close();render()};$('import').onchange=async()=>{try{let d=JSON.parse(await $('import').files[0].text());if(!Array.isArray(d)||!d.every(c=>typeof c.title==='string'&&Array.isArray(c.items)&&c.items.every(r=>typeof r.name==='string')))throw Error();if(confirm('Заменить текущие коллекции резервной копией?')){let old=data;data=d;if(!save())data=old;active=-1;render()}}catch{alert('Неверный файл копии')}$('import').value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
