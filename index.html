<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f3ed"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>MY LIFE</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#332b24;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px 50px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:48px;margin:12px 0}small{color:#78685a;letter-spacing:2px}button,input,textarea,select{font:inherit}button{border:1px solid #d8c9b6;border-radius:12px;padding:12px;background:#fffaf3;color:#332b24;cursor:pointer}button.primary{background:#292720;color:#fff4df} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.tile{text-align:left;min-height:110px;background:#eee5d8}.tile b{display:block;font:24px Georgia;margin:8px 0}.line{background:#fffaf3;border:1px solid #e5d9ca;border-radius:15px;padding:14px;margin:10px 0}.line img{max-width:100%;max-height:240px;border-radius:10px}input:not([type=checkbox]),textarea,select{width:100%;padding:12px;border:1px solid #d8c9b6;border-radius:10px;background:white;margin:6px 0}label{display:block;margin:8px 0}dialog{border:1px solid #d8c9b6;border-radius:20px;width:min(94%,500px);max-height:90vh;background:#f7f3ed;color:#332b24}dialog::backdrop{background:#0006}.actions{display:flex;gap:8px;flex-wrap:wrap}p{line-height:1.5}#notice{color:#78685a;font-size:13px}</style><main><small>THE ART OF LIVING BEAUTIFULLY</small><h1>My Life.</h1><p id="notice"></p><div id="view"></div></main><dialog id="editor"><form id="form"><h2>Запись</h2><label>Название<input id="name" required></label><label>Заметка<textarea id="note"></textarea></label><label>Оценка (необязательно)<input id="rating" type="number" min="0" max="10" step="0.5"></label><label><input id="done" type="checkbox"> Выполнено / просмотрено / прочитано</label><label>Фото<input id="photo" type="file" accept="image/*"></label><label><input id="removePhoto" type="checkbox"> Удалить прежнее фото</label><div class="actions"><button class="primary" type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form></dialog><input hidden type="file" id="import" accept=".json,application/json"><script>
const $=id=>document.getElementById(id), key='my-life-v1';const defaults=['🎬 Кино','📚 Библиотека','🌍 Путешествия','🍽️ Рестораны','🌸 Ароматы','💎 Мечты','🎒 Survival','🛒 Покупки','🦋 Трансформация','🍇 Коллекции'].map(title=>({title,items:[]}));let data,active=-1,editing=-1;try{data=JSON.parse(localStorage.getItem(key))||defaults}catch{data=defaults}function save(){try{localStorage.setItem(key,JSON.stringify(data));$('notice').textContent='Сохранено на этом устройстве';return true}catch{$('notice').textContent='Не удалось сохранить. Освободите место или экспортируйте резервную копию.';return false}}function el(tag,text,parent,cls){let x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;parent.append(x);return x}function btn(parent,text,fn,cls){let b=el('button',text,parent,cls);b.onclick=fn;return b}function render(){let v=$('view');v.replaceChildren();if(active<0){el('p','Моя жизнь в деталях',v);let g=el('div',undefined,v,'grid');data.forEach((c,i)=>{let b=btn(g,'',()=>{active=i;render()},'tile');el('b',c.title,b);el('span',c.items.length+' записей',b)});btn(v,'＋ Новая коллекция',()=>{let t=prompt('Название коллекции');if(t?.trim()){data.push({title:t.trim(),items:[]});save();render()}},'primary');let a=el('div',undefined,v,'actions');btn(a,'Экспорт копии',()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let l=document.createElement('a');l.href=u;l.download='my-life-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),3000)});btn(a,'Импорт копии',()=>$('import').click());el('p','Личные данные остаются в браузере. Регулярно экспортируйте копию: очистка данных Safari может удалить записи.',v);return}let c=data[active];btn(v,'‹ Все коллекции',()=>{active=-1;render()});el('h2',c.title,v);btn(v,'＋ Добавить запись',()=>edit(-1),'primary');let rows=c.items.map((r,i)=>({r,i}));if(active===0)rows.sort((a,b)=>(b.r.rating??-1)-(a.r.rating??-1));rows.forEach(({r,i})=>{let box=el('div',undefined,v,'line');let label=el('label',undefined,box);let check=el('input',undefined,label);check.type='checkbox';check.checked=!!r.done;check.onchange=()=>{r.done=check.checked;save()};label.append(document.createTextNode(' '+r.name));if(r.rating!==null&&r.rating!==undefined)el('p','★ '+r.rating+'/10',box);if(r.note)el('p',r.note,box);if(r.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)){let im=el('img',undefined,box);im.src=r.photo;im.alt=r.name}let a=el('div',undefined,box,'actions');btn(a,'Изменить',()=>edit(i));btn(a,'Удалить',()=>{if(confirm('Удалить запись?')){c.items.splice(i,1);save();render()}})})}function edit(i){editing=i;let r=data[active].items[i]||{};$('name').value=r.name||'';$('note').value=r.note||'';$('rating').value=r.rating??'';$('done').checked=!!r.done;$('photo').value='';$('removePhoto').checked=false;$('editor').showModal()}$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=async e=>{e.preventDefault();let c=data[active],old=c.items[editing],photo=$('removePhoto').checked?'':old?.photo||'';let f=$('photo').files[0];if(f){try{let im=await createImageBitmap(f),cv=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);photo=cv.toDataURL('image/jpeg',.7);im.close()}catch{alert('Не удалось открыть фото');return}}let r={name:$('name').value.trim(),note:$('note').value,rating:$('rating').value===''?null:Number($('rating').value),done:$('done').checked,photo};if(!r.name)return;if(editing<0)c.items.push(r);else c.items[editing]=r;if(!save()){if(editing<0)c.items.pop();else c.items[editing]=old;return}$('editor').close();render()};$('import').onchange=async()=>{try{let d=JSON.parse(await $('import').files[0].text());if(!Array.isArray(d)||!d.every(c=>typeof c.title==='string'&&Array.isArray(c.items)&&c.items.every(r=>typeof r.name==='string')))throw Error();if(confirm('Заменить текущие коллекции резервной копией?')){let old=data;data=d;if(!save())data=old;active=-1;render()}}catch{alert('Неверный файл копии')}$('import').value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
